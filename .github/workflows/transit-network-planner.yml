name: Transit Network Planner

on:
  push:
    paths:
      - "projects/transit-network-lab/**"
      - ".github/workflows/transit-network-planner.yml"
  pull_request:
    paths:
      - "projects/transit-network-lab/**"
      - ".github/workflows/transit-network-planner.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    defaults:
      run:
        working-directory: projects/transit-network-lab
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm run check
      - run: npm test
