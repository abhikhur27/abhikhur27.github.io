name: Portfolio checks

on:
  push:
    paths:
      - "index.html"
      - "projects/**"
      - "visitor-*.mjs"
      - "github-stats.mjs"
      - "contribution-record.mjs"
      - "portrait-easter-egg.*"
      - "portfolio-extras.css"
      - "writing-feed.*"
      - "blog/**"
      - "content/**"
      - "data/*posts.json"
      - "data/writing.json"
      - "scripts/refresh-writing-data.mjs"
      - "data/github-activity.json"
      - "scripts/*github-data.mjs"
      - "tests/**"
      - "supabase/**"
      - ".github/workflows/portfolio-checks.yml"
  pull_request:
    paths:
      - "index.html"
      - "projects/**"
      - "visitor-*.mjs"
      - "github-stats.mjs"
      - "contribution-record.mjs"
      - "portrait-easter-egg.*"
      - "portfolio-extras.css"
      - "writing-feed.*"
      - "blog/**"
      - "content/**"
      - "data/*posts.json"
      - "data/writing.json"
      - "scripts/refresh-writing-data.mjs"
      - "data/github-activity.json"
      - "scripts/*github-data.mjs"
      - "tests/**"
      - "supabase/**"
      - ".github/workflows/portfolio-checks.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs supabase/tests/handler.test.mjs
